<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notes</title>
    <link href="../styles/notes.css" rel="stylesheet">
    <link rel="shortcut icon" href="../notas.png" type="image/x-icon">
</head>
<body>
    <div class="switch-date">
        <p>
            Notas para el: 
        </p>
        <input type="date" id="date" onchange="getNotes()">
    </div>
    <div class="content">
        <p class="note" id="note">
            Cargando...
        </p>
        <button class="escuchar-btn" onclick="speakNote()" title="Escuchar nota" style="display:flex;align-items:center;gap:6px;">
            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M3 10v4h4l5 5V5L7 10H3zm13.5 2c0-1.77-1.02-3.29-2.5-4.03v2.06c.58.35 1 .98 1 1.72s-.42 1.37-1 1.72v2.06c1.48-.74 2.5-2.26 2.5-4.03z"/>
            </svg>
            
        </button>
        <div class="options">
    
            <a href="../index.html">
                <p>Menu</p>
            </a>

            <a onclick="setNote()">
                <p>Siguiente</p>
            </a>
        </div>
    </div>

    <script src="../js/validateLogin.JS"></script>
    <script type="module" src="../js/readNotes.js"></script>
</body>
</html>
